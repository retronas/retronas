my_name: "nginx"
my_file: "install_{{ my_name }}"

nginx_sites_available: "/etc/{{ my_name }}/sites-available"
nginx_sites_enabled: "/etc/{{ my_name }}/sites-enabled"

paths:
  - { name: "www", dest: "/{{ retronas_path }}", owner: "{{ retronas_user }}", group: "{{ retronas_group }}" }

packages:
- { name: "lighttpd", state: "absent" }
- { name: "{{ my_name }}-common", state: "latest" }
- { name: "{{ my_name }}", state: "latest" }

templates:
- { name: "10-retronas.conf",         dest: "{{ nginx_sites_available }}",  mode: "0640", enable: "yes", force: true }
- { name: "99-retronas-files.conf",   dest: "{{ nginx_sites_available }}",  mode: "0640", enable: "yes", force: true }

sites_disable:
- "default"

systemd_units:
- { name: "{{ my_name }}", type: 'service', state: "started", enabled: "yes", restart: "yes", instance: "no" }

firewalld_rules:
  - { zone: "retro",  service: "http" }
  - { zone: "retro",  service: "https" }

site_enable: ""
